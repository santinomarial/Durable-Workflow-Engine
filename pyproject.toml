[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "durable-workflow-engine"
version = "0.1.0"
description = "A minimal durable execution engine built on deterministic replay."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Santino Marial" }]
dependencies = [
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "uvicorn>=0.34",
]

[project.scripts]
engine = "engine.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17",
  "httpx>=0.28",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "chaos: failure-injection correctness tests",
  "integration: tests requiring a PostgreSQL instance",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["engine"]
