name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: durable_test
          POSTGRES_USER: durable
          POSTGRES_PASSWORD: durable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U durable -d durable_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DWE_TEST_DATABASE_URL: postgresql://durable:durable@127.0.0.1:5432/durable_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12 --all-groups
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Test including PostgreSQL integration
        run: uv run pytest
