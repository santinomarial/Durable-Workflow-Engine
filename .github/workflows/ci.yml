name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.2
      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12 --all-groups
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Check operations console JavaScript
        run: node --check ui/app.js
      - name: Check operational shell scripts
        run: sh -n scripts/*.sh
      - name: Validate production Compose topology
        run: docker compose -f compose.production.yaml config --quiet
      - name: Python security analysis
        run: uv run bandit --quiet --recursive engine
      - name: Locked dependency vulnerability audit
        run: uv run scripts/security-audit.sh
      - name: Build wheel and source distribution
        run: uv build
      - name: Unit tests
        run: uv run pytest -m "not integration and not chaos"

  postgres:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: durable_test
          POSTGRES_USER: durable
          POSTGRES_PASSWORD: durable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U durable -d durable_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DWE_TEST_DATABASE_URL: postgresql://durable:durable@127.0.0.1:5432/durable_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.2
      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12 --all-groups
      - name: PostgreSQL integration and SIGKILL chaos tests
        run: uv run pytest -m integration
