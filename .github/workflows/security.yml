name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 2"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build locked production image
        run: docker build --pull --tag dwe-security:${{ github.sha }} .
      - name: Export image for scanner isolation
        run: docker save dwe-security:${{ github.sha }} --output /tmp/dwe-image.tar
      - name: Scan image vulnerabilities
        run: >-
          docker run --rm
          --volume /tmp:/scan:ro
          aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          image --input /scan/dwe-image.tar --exit-code 1 --ignore-unfixed
          --severity HIGH,CRITICAL
      - name: Scan repository secrets and configuration
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/workspace:ro"
          aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          filesystem --scanners secret,misconfig --exit-code 1
          --severity HIGH,CRITICAL /workspace
