name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.2
      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12 --all-groups
      - name: Require tag to match package version
        run: test "v$(uv run python -c 'import engine; print(engine.__version__)')" = "$GITHUB_REF_NAME"
      - name: Run release verification
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m "not integration and not chaos"
          uv run bandit --quiet --recursive engine
          uv run scripts/security-audit.sh
      - name: Build distributions and SBOM
        run: |
          uv build
          uv run scripts/sbom.sh dist/sbom.cdx.json
          cd dist
          sha256sum ./* > SHA256SUMS
      - name: Attest release distributions
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
