services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: durable
      POSTGRES_USER: durable
      POSTGRES_PASSWORD: durable
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durable -d durable"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
